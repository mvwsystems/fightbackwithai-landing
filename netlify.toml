[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The publish dir is the repo root, so the function source would otherwise
# be served as a static file. It holds no secrets, but it is not public API.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

# The Productize Brain is the system prompt, not public API. The function reads
# it from the bundle (included_files), so blocking HTTP access is safe.
[[redirects]]
  from = "/prompts/*"
  to = "/"
  status = 404
  force = true

[functions]
  node_bundler = "esbuild"
  included_files = ["prompts/productize-brain.md"]

# Clean URL for the intake page
[[redirects]]
  from = "/intake"
  to = "/intake.html"
  status = 200
